<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>
    
   <div class="container">
       <h1>My Calculator</h1>
    
    <input type="text" id="display">
        <div class="box">
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="d">+</button>
       </div>
        <div class="box">
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="h">-</button>
       </div>
        <div class="box">
        <button >1</button>
        <button >2</button>
        <button >3</button>
        <button class="l">*</button>
       </div>
        <div class="box">
        <button class="m">C</button>
        <button >0</button>
        <button class="o">=</button>
        <button class="p">/</button>
       </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
